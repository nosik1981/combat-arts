<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Arts | Каталог</title>
    <style>
        /* Базовые настройки */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Фон-клетка с затемнением (картинка теперь в корне) */
            background-image: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        /* Заголовок */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #ff3333; /* Красный цвет */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Сетка товаров */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        /* Карточка товара */
        .card {
            background-color: rgba(30, 30, 30, 0.9); 
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #333;
            transition: transform 0.2s, border-color 0.2s;
            backdrop-filter: blur(5px); 
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #ff3333;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain; /* Чтобы картинка не искажалась */
            border-radius: 8px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); 
        }

        .card h3 {
            font-size: 14px;
            margin: 5px 0;
            color: #e0e0e0;
        }

        .card .price {
            font-size: 16px;
            font-weight: bold;
            color: #ff3333;
            margin-bottom: 15px;
        }

        /* Кнопка */
        .btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>COMBAT ARTS</h1>
        <p style="color: #aaa;">Экипировка для настоящих бойцов</p>
    </div>

    <div class="products">
        <!-- Товар 1 -->
        <div class="card">
            <img src="gloves.png" alt="Перчатки">
            <h3>Боксерские перчатки</h3>
            <div class="price">15 000 ₸</div>
            <button class="btn">В корзину</button>
        </div>

        <!-- Товар 2 -->
        <div class="card">
            <img src="gloves2.png" alt="Щитки">
            <h3>Защита голени</h3>
            <div class="price">8 500 ₸</div>
            <button class="btn">В корзину</button>
        </div>

        <!-- Товар 3 -->
        <div class="card">
            <img src="thermo.png" alt="Термобелье">
            <h3>Термобелье</h3>
            <div class="price">14 000 ₸</div>
            <button class="btn">В корзину</button>
        </div>

        <!-- Товар 4 -->
        <div class="card">
            <img src="bag.png" alt="Сумка">
            <h3>Спортивная сумка</h3>
            <div class="price">9 000 ₸</div>
            <button class="btn">В корзину</button>
        </div>
    </div>

</body>
</html>
